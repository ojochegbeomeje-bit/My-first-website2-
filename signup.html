  <h1>Sign Up</h1>
  <form id="signupForm">
    <input type="text" id="su_name" placeholder="Full Name" required><br><br>
    <input type="email" id="su_email" placeholder="Email" required><br><br>
    <input type="password" id="su_password" placeholder="Password" required><br><br>
    <input type="password" id="su_confirm" placeholder="Confirm Password" required><br><br>
    <button type="submit">Sign Up</button>
  </form>
    <p>Already have an account? <a href="signin.html">Sign In here</a></p><br>
  </form>
  <script src="script.js"></script>
</body>
