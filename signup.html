<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="contact.html">Contact Us</a></li>
      <li><a href="signin.html">Sign In</a></li>
      <li><a href="signup.html">Sign Up</a></li>
    </ul>
  </nav>
  <h1>Sign Up</h1>
  <form>
    <label>Full Name:</label><br>
    <input type="text" placeholder="Enter your full name" required><br><br> 
    <label>Email:</label><br>
    <input type="email" placeholder="Enter your email" required><br><br>
    <label>Password:</label><br>
    <input type="password" placeholder="Enter your password" required><br><br>
    <label>Confirm Password:</label><br>
    <input type="password" placeholder="Confirm your password" required><br><br>
    <button type="submit">Sign Up</button><br>
    <p>Already have an account? <a href="signin.html">Sign In here</a></p><br>
  </form>
  <script src="script.js"></script>
</body>
</html>
